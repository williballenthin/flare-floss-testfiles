Build instructions (Windows): |
    (gobfuscate needs GOPATH mode and a POSIX shell; see build.sh)
    sh build.sh go bin/test-go-gobfuscate.exe windows 386

Build instructions (Linux): |
    ./build.sh go bin/test-go-gobfuscate linux amd64

Build instructions (Cross compile for Windows on Linux): |
    ./build.sh go bin/test-go-gobfuscate.exe windows 386
    ./build.sh go bin/test-go-gobfuscate64.exe windows amd64

